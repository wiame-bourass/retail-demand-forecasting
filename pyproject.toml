[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Promotion-aware hierarchical and grouped retail sales forecasting on Corporacion Favorita."
requires-python = ">=3.11,<3.13"
authors = [{name = "Wiame Bourass"}]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
