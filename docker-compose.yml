services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FORECAST_OUTPUT: /app/outputs/test_forecasts.parquet
      MODEL_CARD: /app/artifacts/model_card.json
  dashboard:
    build: .
    command: streamlit run src/favorita_forecasting/dashboard/app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      FAVORITA_OUTPUTS: /app/outputs
      FAVORITA_ARTIFACTS: /app/artifacts
